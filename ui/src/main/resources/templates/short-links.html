<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>Short Links - DMS Member Portal</title>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .short-link-card {
            transition: all 0.3s ease;
        }
        .short-link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1) !important;
        }
        .click-count {
            background-color: #e9ecef;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }
        .link-path {
            color: #0d6efd;
            font-weight: 500;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="mt-4 mb-2">Popular Short Links</h1>
                    <p class="text-muted">Discover the most-used Dallas Makerspace branded short URLs</p>
                </div>
                <div th:if="${can_access_admin}">
                    <a href="/short-links/admin" class="btn btn-primary">
                        <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle; margin-right: 5px;">settings</span>
                        Manage Links
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Popular Links -->
    <div class="row">
        <div class="col-12">
            <div id="popularLinksList" class="row"></div>
        </div>
    </div>

    <!-- No Links Message -->
    <div id="noLinksMessage" class="row" style="display: none;">
        <div class="col-12">
            <div class="alert alert-info text-center">
                <p class="mb-0">No short links have been created yet.</p>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    window.shortLinksConfig = {
        canAccessAdmin: /*[[${can_access_admin}]]*/ false,
        username: /*[[${username}]]*/ ''
    };
    /*]]>*/
</script>
<script>
    // Load and display popular short links
    async function loadPopularLinks() {
        try {
            const response = await fetch('/backend-api/short-links/links/popular?limit=20');
            const result = await response.json();

            if (result.status === 'SUCCESS' && result.data && result.data.length > 0) {
                displayPopularLinks(result.data);
                document.getElementById('noLinksMessage').style.display = 'none';
            } else {
                document.getElementById('popularLinksList').innerHTML = '';
                document.getElementById('noLinksMessage').style.display = 'block';
            }
        } catch (error) {
            console.error('Error loading popular links:', error);
            document.getElementById('popularLinksList').innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">
                        <p>Error loading popular short links. Please try again later.</p>
                    </div>
                </div>
            `;
        }
    }

    function displayPopularLinks(links) {
        const container = document.getElementById('popularLinksList');
        container.innerHTML = '';

        links.forEach((item, index) => {
            const link = item.link;
            const clicks = item.clicks || 0;
            const safePath = escapeHtml(formatPath(link));
            const safeDescription = escapeHtml(link.description) || 'No description';
            const safeDestinationUrl = escapeHtml(link.destinationUrl);

            const card = document.createElement('div');
            card.className = 'col-md-6 col-lg-4 mb-4';
            card.innerHTML = `
                <div class="card short-link-card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title mb-0">#${index + 1}</h5>
                            <span class="click-count">
                                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">touch_app</span>
                                ${clicks}
                            </span>
                        </div>
                        <p class="text-muted small mb-3">${safeDescription}</p>
                        <div class="mb-3">
                            <p class="small text-muted mb-1">Short URL:</p>
                            <p class="link-path mb-0">dallas.ms/${safePath}</p>
                        </div>
                        <div class="mb-3">
                            <p class="small text-muted mb-1">Destination:</p>
                            <a href="${safeDestinationUrl}" target="_blank" rel="noopener noreferrer" class="text-truncate" style="display: block; text-decoration: none; color: #0d6efd;">
                                ${safeDestinationUrl}
                            </a>
                        </div>
                        <div class="mt-auto">
                            <button type="button" onclick="copyToClipboard('dallas.ms/${safePath}');" class="btn btn-sm btn-outline-primary w-100">
                                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">content_copy</span>
                                Copy Link
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function formatPath(link) {
        if (link.namespaceId) {
            // Assuming we have the namespace path available, use namespace alias + slug
            // Since we don't have the alias in this response, just show the slug
            // In a real scenario, you'd fetch the alias or have it included in the response
            return link.slug;
        }
        return link.slug;
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('Copied to clipboard: ' + text);
        }).catch(err => {
            console.error('Error copying to clipboard:', err);
        });
    }

    // Load popular links on page load
    document.addEventListener('DOMContentLoaded', loadPopularLinks);
</script>
</body>
</html>
