<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>Server Error</title>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/index.css"/>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .main {
            gap: 0;
        }
        .error-container h2 {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .error-container div {
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="main">
    <section class="main-inner">
        <div class="error-container">
            <h2>Server Error</h2>
            <p th:text="${message}"/>
            <div><span>Session: </span><span th:text="${sessionid}"></span></div>
            <div><span>UserId: </span><span th:text="${userid}"></span></div>
            <a class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#error-details" role="button"
               aria-expanded="false" aria-controls="error-details">Technical Details</a>
            <div class="row">
                <div class="col">
                    <div class="collapse" id="error-details">
                        <div class="card card-body" th:text="${cause}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="../static/js/app.js"></script>
<script src="../static/js/dms-page-loader.js" defer></script>

</body>
</html>
