name: UI CD

# Deploys the member profile UI to production
# Includes: Gradle caching, Trivy security scanning, health checks, rollback capability

on:
  push:
    branches: [ "master" ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-cd.yml'
      - '.github/workflows/common-cd.yml'

jobs:
  deploy:
    uses: ./.github/workflows/common-cd.yml
    with:
      component: ui
      port: "8080"
      internal_port: "8000"
      env_file_path: ~/member-profile/actions-runner-ui/.env
      image_name: dallas-makerspace/member-portal/ui
      container_name: member-profile-ui
    secrets: inherit
