<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Cameras - DMS Member Portal</title>
    <style>
        .stream-card { transition: all 0.2s ease; }
        .stream-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.15) !important; }
        .camera-feed { background: #000; line-height: 0; }
        .camera-feed dms-timelapse-view { border-radius: 0; }
        .card-footer { font-size: .75rem; }
    </style>
</head>
<body>

<header class="top-nav" th:replace="~{fragments/header :: header}"></header>

<div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-3">
        <h4 class="mb-0">Cameras</h4>
        <span id="health-badge" class="badge bg-secondary">Connecting…</span>
    </div>

    <div class="row g-3" id="stream-grid">
        <div class="col-12 text-center text-muted py-5">
            <div class="spinner-border spinner-border-sm me-2"></div>
            Loading streams…
        </div>
    </div>

    <h6 class="mt-4 mb-2 text-muted">Thumbnail view</h6>
    <div class="row g-2" id="thumb-grid">
        <div class="col-12 text-center text-muted py-3">
            <div class="spinner-border spinner-border-sm me-2"></div>
            Loading…
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-timelapse-view.js"></script>

<script>
  const grid      = document.getElementById('stream-grid');
  const thumbGrid = document.getElementById('thumb-grid');

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function buildCard(s) {
    const col = document.createElement('div');
    col.className = 'col-12 col-md-6';
    col.innerHTML = `
      <div class="card stream-card h-100" id="card-${escHtml(s.id)}">
        <div class="card-header d-flex align-items-center gap-2 py-2">
          <span class="fw-semibold">${escHtml(s.name)}</span>
          <span class="badge ms-1 ${s.connected ? 'bg-success' : 'bg-danger'}">
            ${s.connected ? 'Connected' : 'Offline'}
          </span>
        </div>
        <div class="card-body p-0 camera-feed">
          <dms-timelapse-view stream="${escHtml(s.id)}" buffer-secs="${escHtml(s.config.rolling_window_secs)}"></dms-timelapse-view>
        </div>
        <div class="card-footer text-muted d-flex flex-wrap gap-3 py-1">
          <span>${escHtml(s.config.frame_interval_secs)}s interval</span>
          <span>${escHtml(s.config.rolling_window_secs)}s buffer</span>
          <span>${escHtml(s.config.format.toUpperCase())}</span>
          ${s.config.resolution
            ? `<span>${escHtml(s.config.resolution.width)}&times;${escHtml(s.config.resolution.height)}</span>`
            : ''}
        </div>
      </div>
    `;
    return col;
  }

  function buildThumb(s) {
    const col = document.createElement('div');
    col.className = 'col-6 col-md-3 col-lg-2';
    col.innerHTML = `
      <div class="card stream-card h-100" style="overflow:hidden">
        <div class="card-body p-0 camera-feed">
          <dms-timelapse-view variant="thumbnail" stream="${escHtml(s.id)}" buffer-secs="${escHtml(s.config.rolling_window_secs)}"></dms-timelapse-view>
        </div>
        <div class="card-footer py-1 text-truncate small">${escHtml(s.name)}</div>
      </div>
    `;
    return col;
  }

  async function init() {
    try {
      const res = await fetch('/cameras-api/streams');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const streams = await res.json();

      grid.innerHTML = '';
      thumbGrid.innerHTML = '';
      if (!streams.length) {
        grid.innerHTML = '<div class="col-12 text-center text-muted py-5">No streams configured.</div>';
        thumbGrid.innerHTML = '';
        return;
      }
      for (const s of streams) {
        grid.appendChild(buildCard(s));
        thumbGrid.appendChild(buildThumb(s));
      }
    } catch (e) {
      grid.innerHTML = `<div class="col-12 text-center text-danger py-5">Failed to load streams: ${escHtml(e.message)}</div>`;
      thumbGrid.innerHTML = '';
    }
  }

  async function refreshHealth() {
    const badge = document.getElementById('health-badge');
    try {
      const res = await fetch('/cameras-api/health');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const h = await res.json();
      badge.textContent = `${h.streams_connected}/${h.streams_total} online`;
      badge.className = `badge ${h.streams_connected > 0 ? 'bg-success' : 'bg-danger'}`;
    } catch {
      badge.textContent = 'Unreachable';
      badge.className = 'badge bg-danger';
    }
  }

  init();
  refreshHealth();
  setInterval(refreshHealth, 15_000);
</script>

</body>
</html>
