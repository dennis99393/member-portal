<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Badge Validation (Active Directory)</title>
</head>
<body>
<div th:fragment="report">
    <!-- Restriction note - ALWAYS shown to all users -->
    <div class="alert alert-info" role="alert">
        <strong>Note:</strong> This report is restricted to IT Infrastructure team.
    </div>

    <!-- Report content - ONLY shown to authorized users -->
    <div th:if="${is_infra}">
        <!-- Data visualizer component -->
        <dms-data-visualizer
                id="badge-validation-ad-visualizer"
                dataUrl="/backend-api/data-viz/badge-validation-ad"
                renderAs="table"
                title="Badge Validation (Active Directory)"
                description="Active users in AD with badge numbers less than 10 digits"
                filterable="true"
                alwaysShowRawData="true"
        ></dms-data-visualizer>
    </div>
</div>
</body>
</html>
