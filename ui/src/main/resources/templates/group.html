<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <link rel="stylesheet" href="../static/styles/global.css"/>
    <link rel="stylesheet" href="../static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="'Group: ' + ${name}"></title>
</head>
<body>
<header class="top-nav" th:replace="fragments/header :: header"></header>
<div class="profile">
    <section class="content">
        <!- Group title card -->
        <div class="card-linked-accounts">
            <div class="linked-accounts" th:text="${name}"></div>
            <div class="discourse-icon-1-parent">
                <div class="frame-wrapper">
                    <div class="talk-member-parent">
                        <div class="voting-self-service">
                            <span th:if="${description}" th:text="${description}"></span>
                            <span th:unless="${description}">No description for this group 🙁. Please ask the committee chair to add a description.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Assigned members card -->
        <div class="card-linked-accounts">
            <div class="linked-accounts">Members Assigned</div>
            <div class="discourse-icon-1-parent">
                <div>
                    <div th:each="member : ${members}">
                        <div>
                            <span th:text="${member.displayName}"></span>
                            &nbsp;&nbsp;
                            <a style="margin:4px" class=""
                               th:href="|/profile/@${member.username}|" th:text="|@${member.username}|"></a>
                        </div>
                    </div>
                    <br/><br/>
                    <span th:if="${memberlist_incomplete}">⚠️ Only some of the assigned members are listed above.
                        To check if a specific member has been assigned to this group please check the member profile.</span>
                    <span th:unless="${members}">No members assigned to this group yet.</span>
                </div>
            </div>
        </div>
    </section>
</div>


<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="../static/js/app.js"></script>
</body>
</html>
