<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Personal Bin Scanner - DMS Member Portal</title>
    <style>
        #camera-container {
            position: relative;
            width: 100%;
            max-height: 40vh;
            background: #111;
            overflow: hidden;
            border-radius: 0.5rem;
        }
        #camera-container > div { width: 100%; }
        #camera-container video {
            width: 100%;
            max-height: 40vh;
            object-fit: cover;
            display: block;
        }
        .scan-row { transition: background 0.3s ease; }
        .scan-row.new-scan { background: rgba(25, 135, 84, 0.08); }
        .status-badge { min-width: 70px; text-align: center; }
        #toast-strip { min-height: 2rem; font-size: 0.85rem; }
    </style>
</head>
<body>

<header class="top-nav" th:replace="~{fragments/header :: header}"></header>

<div class="container py-3">
    <div class="d-flex align-items-center gap-3 mb-2 flex-wrap">
        <h4 class="mb-0">Personal Bin Scanner <span class="badge bg-warning text-dark" style="font-size:0.55em;vertical-align:middle">Beta</span></h4>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span id="scan-count-badge" class="badge bg-secondary">0 scanned</span>
            <button id="email-btn" class="btn btn-sm btn-outline-primary"
                    style="display:none" disabled
                    th:if="${isPrivilegedViewer}">
                Send email to inactive &gt; 15 days
            </button>
            <button id="clear-btn" class="btn btn-sm btn-outline-secondary" style="display:none">Clear list</button>
            <button id="pause-btn" class="btn btn-sm btn-warning" style="display:none">Pause</button>
            <button id="start-btn" class="btn btn-sm btn-success">Start</button>
        </div>
    </div>

    <!-- Camera viewport -->
    <div id="camera-container" class="mb-2 shadow-sm" style="display:none">
        <div id="camera"></div>
    </div>

    <!-- Feedback strip -->
    <div id="toast-strip" class="text-muted mb-3 ps-1"></div>

    <!-- Empty state — hidden after first scan -->
    <div id="empty-state" class="card border-0 bg-light p-4 text-center text-muted mb-2">
        <h5 class="mb-2">Personal Bin Scanner</h5>
        <p class="mb-2">Point the camera at a bin's QR code to look up the owner's membership status.</p>
        <p class="small mb-0">Logistics Committee Chairs and Infrastructure members also see phone and email for follow-up.</p>
    </div>

    <!-- Scanned list -->
    <div id="scan-list"></div>

    <!-- Privileged flag passed from server -->
    <meta id="privileged-meta" th:attr="data-privileged=${isPrivilegedViewer}"/>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- html5-qrcode -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-member-card.js"></script>
<script type="module" src="/static/js/dms-bin-scanner.js"></script>

</body>
</html>
