<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>DMS Member Portal</title>

    <link rel="stylesheet" href="./static/styles/global.css"/>
    <link rel="stylesheet" href="./static/styles/index.css"/>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="./static/js/dms-search-v1.js" defer></script>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="main">
    <section class="main-inner">
        <div class="welcome-member-22-parent">
            <h1 class="welcome-member-22">Welcome, <span th:text="${name}"></span>!</h1>
            <div class="edit-your-profile-wrapper">
                <div class="edit-your-profile" id="editYourProfile">
                    <a th:href="${profile_url}">View your profile</a>
                </div>
            </div>
        </div>
    </section>
    <div class="search-wrapper">
        <dms-search max-results="7"></dms-search>
    </div>
</div>

<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
