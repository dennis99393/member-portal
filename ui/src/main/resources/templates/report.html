<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script type="module" src="/static/js/dms-data-visualizer.js"></script>
    <title th:text="${reportTitle != null ? reportTitle : 'Report'}"></title>
    <style>
        .breadcrumb-item + .breadcrumb-item::before {
            content: ">" !important;
        }
        .child-reports-list {
            margin-top: 2rem;
        }
        .child-report-card {
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        .child-report-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .breadcrumb {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <!-- Breadcrumbs - only show if not on root page -->
            <nav aria-label="breadcrumb" class="mt-3" th:if="${parentNode != null || childNode != null}">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/reports">Reports</a></li>
                    <li class="breadcrumb-item" th:if="${parentNode != null && childNode != null}">
                        <a th:href="'/reports/' + ${parentNode.urlSlug}" th:text="${parentNode.name}"></a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:if="${parentNode != null && childNode == null}"
                        th:text="${parentNode.name}"></li>
                    <li class="breadcrumb-item active" aria-current="page" th:if="${childNode != null}"
                        th:text="${childNode.name}"></li>
                </ol>
            </nav>

            <!-- Child reports list if this is a parent node with children -->
            <div class="child-reports-list"
                 th:if="${showChildren != null && showChildren && childrenNodes != null && !childrenNodes.isEmpty()}">
                <h2 class="mb-4" th:text="${(parentNode != null ? parentNode.name + ' ' : '') + 'Reports'}"></h2>
                <div class="row">
                    <div class="col-md-6 col-lg-4" th:each="node : ${childrenNodes}">
                        <div class="card child-report-card">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${node.name}"></h5>
                                <p class="card-text" th:text="${node.description}"></p>
                                <a th:if="${parentNode != null}"
                                   th:href="'/reports/' + ${parentNode.urlSlug} + '/' + ${node.urlSlug}"
                                   class="btn btn-primary">View Report</a>
                                <a th:if="${parentNode == null}"
                                   th:href="'/reports/' + ${node.urlSlug}"
                                   class="btn btn-primary">View Report</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Report Content -->
            <div th:each="fragName : ${fragmentList}">
                <!-- from this template, insert the fragment named by `fragName` -->
                <div th:insert="~{${fragName} :: report}"></div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-member-card.js" type="module"></script>
<script src="/static/js/dms-relative-date.js" type="module"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
