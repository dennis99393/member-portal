<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Committees - DMS Member Portal</title>
    <style>
        .committee-card {
            transition: all 0.3s ease;
        }
        .committee-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1) !important;
        }
        .chair-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .chair-avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chair-link:hover {
            text-decoration: underline !important;
        }
        /* Section label with proper icon-text alignment */
        .section-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6c757d;
            font-size: 0.875rem;
            margin-bottom: 8px;
        }
        .section-label .material-symbols-outlined {
            font-size: 16px;
            line-height: 1;
        }
        /* Chair item with proper avatar-text alignment */
        .chair-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .chair-item .material-symbols-outlined {
            font-size: 40px;
            color: #6c757d;
            line-height: 1;
            flex-shrink: 0;
        }
        /* Teacher groups container */
        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .teacher-group-badge {
            background-color: #e1f2f7;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 0.85rem;
            text-decoration: none;
            color: #0a7ca0;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .teacher-group-badge:hover {
            background-color: #0b9cc9;
            color: white;
        }
        .committees-table td {
            vertical-align: middle;
        }
        .committees-table tr:hover {
            background-color: rgba(0, 0, 0, 0.04);
        }
        .empty-state {
            color: #6c757d;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container-fluid container-lg pb-5 px-3 px-lg-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mt-4 mb-2">Committees</h1>
            <p class="text-muted mb-4">Dallas Makerspace committees and their leadership</p>
        </div>
    </div>

    <!-- Desktop Table View (lg and up) -->
    <div class="d-none d-lg-block">
        <div class="card shadow-sm">
            <table class="table table-hover committees-table mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 20%">Committee</th>
                        <th style="width: 25%">Chair</th>
                        <th>Teacher Groups</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="committee : ${committees}">
                        <td th:text="${committee.name}"></td>
                        <td>
                            <div th:if="${committee.chairpersons != null and !committee.chairpersons.empty}">
                                <div th:each="chair : ${committee.chairpersons}" class="d-flex align-items-center mb-1">
                                    <img th:if="${chair.avatarUrl != ''}"
                                         th:src="${chair.avatarUrl}"
                                         class="chair-avatar-sm me-2"
                                         alt=""/>
                                    <span th:if="${chair.avatarUrl == ''}"
                                          class="material-symbols-outlined me-2"
                                          style="font-size: 32px; color: #6c757d;"
                                          aria-hidden="true">account_circle</span>
                                    <a th:href="'/profile/@' + ${chair.username}"
                                       th:text="${chair.displayName != null ? chair.displayName : chair.username}"
                                       class="text-decoration-none chair-link"></a>
                                </div>
                            </div>
                            <span th:if="${committee.chairpersons == null or committee.chairpersons.empty}"
                                  class="text-muted small" aria-label="No chairperson assigned">—</span>
                        </td>
                        <td>
                            <div th:if="${committee.teacherGroups != null and !committee.teacherGroups.empty}" class="badges-container">
                                <a th:each="group : ${committee.teacherGroups}"
                                   th:href="'/groups/' + ${group.slug}"
                                   th:text="${group.name}"
                                   class="teacher-group-badge"></a>
                            </div>
                            <span th:if="${committee.teacherGroups == null or committee.teacherGroups.empty}"
                                  class="text-muted small" aria-label="No teacher groups">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Mobile/Tablet Card View (below lg) -->
    <div class="d-lg-none">
        <div class="row">
            <div th:each="committee : ${committees}" class="col-md-6 mb-4">
                <div class="card committee-card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">
                        <!-- Committee Name -->
                        <h5 class="card-title mb-3" th:text="${committee.name}"></h5>

                        <!-- Description (if available) -->
                        <p th:if="${committee.description}"
                           class="card-text text-muted small mb-3"
                           th:text="${committee.description}"></p>

                        <!-- Chairpersons Section -->
                        <div class="mb-3">
                            <div class="section-label">
                                <span class="material-symbols-outlined" aria-hidden="true">person</span>
                                <span>Chair<span th:if="${committee.chairpersons != null and #lists.size(committee.chairpersons) > 1}">s</span></span>
                            </div>
                            <div th:if="${committee.chairpersons != null and !committee.chairpersons.empty}">
                                <div th:each="chair : ${committee.chairpersons}" class="chair-item">
                                    <img th:if="${chair.avatarUrl != ''}"
                                         th:src="${chair.avatarUrl}"
                                         class="chair-avatar"
                                         alt=""/>
                                    <span th:if="${chair.avatarUrl == ''}"
                                          class="material-symbols-outlined"
                                          aria-hidden="true">account_circle</span>
                                    <a th:href="'/profile/@' + ${chair.username}"
                                       th:text="${chair.displayName != null ? chair.displayName : chair.username}"
                                       class="text-decoration-none chair-link"></a>
                                </div>
                            </div>
                            <span th:if="${committee.chairpersons == null or committee.chairpersons.empty}"
                                  class="empty-state">No chairperson assigned</span>
                        </div>

                        <!-- Teacher Groups Section -->
                        <div class="mt-auto">
                            <div class="section-label">
                                <span class="material-symbols-outlined" aria-hidden="true">school</span>
                                <span>Teacher Groups</span>
                            </div>
                            <div th:if="${committee.teacherGroups != null and !committee.teacherGroups.empty}" class="badges-container">
                                <a th:each="group : ${committee.teacherGroups}"
                                   th:href="'/groups/' + ${group.slug}"
                                   th:text="${group.name}"
                                   class="teacher-group-badge"></a>
                            </div>
                            <span th:if="${committee.teacherGroups == null or committee.teacherGroups.empty}"
                                  class="empty-state">No teacher groups</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
