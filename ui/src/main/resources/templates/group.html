<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="'Group: ' + ${name}"></title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-4">
            <!-- Group title card -->
            <div class="card shadow-sm overflow-hidden mt-4">
                <div class="card-body">
                    <h2 class="card-title mb-3" th:text="${name}"></h2>
                    <div class="card-text">
                        <span th:if="${description}" th:text="${description}"></span>
                        <span th:unless="${description}" class="text-muted">No description for this group 🙁. Please ask the committee chair to add a description.</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <!-- Assigned members card -->
            <div class="card mt-4">
                <div class="card-body">
                    <h3 class="card-title mb-3">Members Assigned</h3>
                    <div class="card-text">
                        <div th:if="${members}" class="member-list">
                            <div th:each="member : ${members}" class="member-item mb-2">
                                <span th:text="${member.displayName}" class="fw-bold"></span>
                                <a class="ms-2 text-decoration-none"
                                   th:href="|/profile/@${member.username}|" th:text="|@${member.username}|"></a>
                            </div>
                            <div th:if="${memberlist_incomplete}" class="alert alert-warning mt-3" role="alert">
                                <strong>⚠️ Note:</strong> Only some of the assigned members are listed above.
                                To check if a specific member has been assigned to this group please check the member
                                profile.
                            </div>
                        </div>
                        <div th:unless="${members}" class="text-muted">
                            No members assigned to this group yet.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
