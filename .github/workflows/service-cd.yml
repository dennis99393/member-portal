name: Service CD

# Deploys the member profile service to production
# Includes: Gradle caching, Trivy security scanning, health checks, rollback capability

on:
  push:
    branches: [ "master" ]
    paths:
      - 'service/**'
      - '.github/workflows/service-cd.yml'
      - '.github/workflows/common-cd.yml'

jobs:
  deploy:
    uses: ./.github/workflows/common-cd.yml
    with:
      component: service
      port: "8081"
      internal_port: "8081"
      env_file_path: ~/member-profile/actions-runner-service/.env
      image_name: dallas-makerspace/member-profile-service
      container_name: member-profile-service
    secrets: inherit
