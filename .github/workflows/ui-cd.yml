name: UI CD

on:
  push:
    branches: [ "master" ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-cd.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: app-member-profile-ui

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Build
        run: ./gradlew :ui:build

      - name: Run Tests
        run: ./gradlew :ui:test

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          file: ui/prod.Dockerfile
          tags: ghcr.io/dallas-makerspace/member-profile-ui:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/delete-package-versions@v5
        with:
          package-name: member-profile-ui
          package-type: 'container'
          min-versions-to-keep: 5

  deploy:
    needs: build-and-push-image
    name: Deploy app to docker container
    runs-on: self-hosted

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: |
          docker pull ghcr.io/dallas-makerspace/member-profile-ui:latest

      - name: Recreate Docker container
        run: |
          docker stop member-profile-ui || true
          docker rm member-profile-ui || true
          docker run -d --restart unless-stopped --network member-portal --env-file ~/member-profile/actions-runner-ui/.env --name member-profile-ui -p 8080:8000 ghcr.io/dallas-makerspace/member-profile-ui:latest
