<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="../static/styles/global.css" />
    <link rel="stylesheet" href="../static/styles/profile.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="profile">
    <header class="top-nav1">
        <div class="top-nav-separator">
            <div class="top-nav-title">
                <div class="dms-title"><a href="/" class="link-reset">DMS Member Profiles</a></div>
            </div>
        </div>
        <div class="top-nav-divider1"></div>
    </header>
    <section class="content">
        <div class="card-bio1">
            <div class="linked-accounts-label">
                <div class="profile-pic">
                    <img src="../static/images/profile-pic-not-set.svg" alt="Profile Picture">
                </div>
                <div class="bg-pic">
                    <img
                            class="mask-group-icon"
                            alt=""
                            src="../static/images/bg.webp"
                    />
                </div>
                <div class="user-fullname" th:text="${name}"></div>
            </div>
            <div class="username">
                <b class="username-label" th:text="'@' + ${preferred_username}"></b>
            </div>
            <div class="card-bio-inner">
                <div class="frame-parent">
                    <div class="unauth-circle-parent">
                        <img
                                class="unauth-circle-icon"
                                loading="lazy"
                                alt=""
                                src="../static/images/diamond-exclaimation.svg"
                        />

                        <div class="link-account-label">
                            <b class="member-since-apr"
                            >Not authorized to view this profile.</b
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
