openapi: "3.0.3"
info:
  title: "member-profile-service"
  description: "API for accessing DMS member profile info"
  version: "0.0.1"
paths:
  /members/{username}:
    get:
      description: "Get a member's data by username"
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: "Username of the member"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DMSMember'
              examples:
                Example#1:
                  value:
                    username: "exampleUser"
                    discourseUsername: "exampleDiscourseUsername"
        "404":
          description: "Not Found"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "Member not found"
        "500":
          description: "Internal Server Error"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "Internal Server Error"
  # Endpoint to update member properties
  /members/{username}/update:
    patch:
      description: "Update a member's discourseUsername"
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: "Username of the member"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DMSMember'
      responses:
        "200":
          description: "OK"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "discourse username updated"
        "400":
          description: "Bad Request"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "Invalid discourse_id"
        "404":
          description: "Not Found"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "Member not found"
        "500":
          description: "Internal Server Error"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "Internal Server Error"
components:
  schemas:
    DMSMember:
      type: object
      properties:
        username:
          type: string
        discourseUsername:
          type: string
        discourseAvatarUrl:
          type: string