ktor {
    development = true
    development = ${?DEV_MODE}
    deployment {
        port = 8081
        port = ${?PORT}
    }
}
app {
    use-mock-services = true
    use-mock-services = ${?USE_MOCK_SERVICES}
    discourse {
        apiKey = "dummy-secret-for-dev"
        apiKey = ${?DISCOURSE_API_KEY}
    }
    db {
        url = "jdbc:mariadb://localhost:3306/member_profile"
        url = ${?DB_URL}
        user = "member-profile-user"
        user = ${?DB_USER}
        password = "dummy-password-for-dev"
        password = ${?DB_PASSWORD}
    }
    db-master {
            url = "jdbc:mariadb://localhost:34407"
            url = ${?DB_MASTER_URL}
            user = "member_portal_svc"
            user = ${?DB_MASTER_USER}
            password = "dummy-password-for-dev"
            password = ${?DB_MASTER_PASSWORD}
        }
    api {
        # Number of API clients configured via indexed environment variables
        # API_CLIENT_0_NAME, API_CLIENT_0_KEY, API_CLIENT_0_ROLES
        # API_CLIENT_1_NAME, API_CLIENT_1_KEY, API_CLIENT_1_ROLES
        # etc.
        client-count = 1
        client-count = ${?API_CLIENT_COUNT}

        # Fallback for local development (when env vars are not set)
        # These are only used if API_CLIENT_0_NAME is not set
        fallback {
            name = "member-profile-ui"
            key = "dummy-key-for-dev"
            roles = "member:read,member:write,group:read,group:write,badge:read,dataviz:read"
        }
    }
    ldap {
        host = "localhost"
        host = ${?LDAP_HOST}
        port = 389
        port = ${?LDAP_PORT}
        user = "cn=admin,dc=dms,dc=local"
        user = ${?LDAP_USER}
        password = "Adm1n!"
        password = ${?LDAP_PASSWORD}
    }
    logging {
        level = "debug"
        level = ${?ENV_LOG_LEVEL}
        elastic-host = "localhost"
        elastic-host = ${?ENV_ELASTIC_HOST}
        elastic-api-key = "dummy-key-for-dev"
        elastic-api-key = ${?ENV_ELASTIC_API_KEY}
    }
}