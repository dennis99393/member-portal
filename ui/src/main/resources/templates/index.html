<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>DMS Member Portal</title>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="./static/styles/global.css"/>
    <link rel="stylesheet" href="./static/styles/index.css"/>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="main">
    <section class="main-inner">
        <div class="welcome-member-22-parent">
            <h1 class="welcome-member-22">Welcome, <span th:text="${name}"></span>!</h1>
            <div class="edit-your-profile-wrapper">
                <div class="edit-your-profile" id="editYourProfile">
                    <a th:href="${profile_url}">View your profile</a>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Featured Projects Row -->
<section th:if="${featured_projects != null and !#lists.isEmpty(featured_projects)}"
         class="featured-projects-section">
    <div class="featured-projects-header">
        <div>
            <h2 class="featured-projects-heading">Featured Projects</h2>
            <p class="featured-projects-subtitle">Member creations from Show &amp; Tell</p>
        </div>
    </div>
    <div class="featured-projects-track-wrap">
        <button class="featured-scroll-btn featured-scroll-btn--left" aria-label="Scroll left">&#8249;</button>
        <div class="featured-projects-row" id="featuredProjectsRow">
            <a th:each="p : ${featured_projects}"
               th:href="${p.profileUrl}"
               class="featured-project-card">
                <div class="featured-project-img-wrap">
                    <img th:src="${p.imageUrl}" th:alt="${p.memberDisplayName}"
                         class="featured-project-img" loading="lazy"/>
                    <span th:if="${p.likeCount > 0}" class="featured-project-likes-badge">
                        &#10084; <span th:text="${p.likeCount}"></span>
                    </span>
                    <div class="featured-project-overlay">
                        <img th:if="${p.memberAvatarUrl != null and !#strings.isEmpty(p.memberAvatarUrl)}"
                             th:src="${p.memberAvatarUrl}" th:alt="${p.memberDisplayName}"
                             class="featured-project-avatar" loading="lazy"/>
                        <span th:if="${p.memberAvatarUrl == null or #strings.isEmpty(p.memberAvatarUrl)}"
                              class="featured-project-avatar-placeholder"></span>
                        <span class="featured-project-author" th:text="${p.memberDisplayName}"></span>
                    </div>
                </div>
            </a>
        </div>
        <button class="featured-scroll-btn featured-scroll-btn--right" aria-label="Scroll right">&#8250;</button>
    </div>
</section>

<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script>
(function () {
    var row = document.getElementById('featuredProjectsRow');
    if (!row) return;
    var wrap = row.closest('.featured-projects-track-wrap');
    var btnLeft = wrap.querySelector('.featured-scroll-btn--left');
    var btnRight = wrap.querySelector('.featured-scroll-btn--right');
    var STEP = 640;

    function update() {
        var atStart = row.scrollLeft <= 4;
        var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
        btnLeft.style.opacity = atStart ? '0' : '1';
        btnLeft.style.pointerEvents = atStart ? 'none' : 'auto';
        btnRight.style.opacity = atEnd ? '0' : '1';
        btnRight.style.pointerEvents = atEnd ? 'none' : 'auto';
        wrap.classList.toggle('fade-left', !atStart);
        wrap.classList.toggle('fade-right', !atEnd);
    }

    btnLeft.addEventListener('click', function () {
        row.scrollBy({ left: -STEP, behavior: 'smooth' });
    });
    btnRight.addEventListener('click', function () {
        row.scrollBy({ left: STEP, behavior: 'smooth' });
    });
    row.addEventListener('scroll', update, { passive: true });
    update();
}());
</script>
</body>
</html>
