name: CD

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: app-member-profile-ui

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Build
        run: ./gradlew build

      - name: Run ktfmtCheck
        run: ./gradlew ktfmtCheck

      - name: Run Tests
        run: ./gradlew test

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.10.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: prod.Dockerfile
          tags: ghcr.io/dallas-makerspace/${{ github.event.repository.name }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    name: Deploy app to docker container
    runs-on: self-hosted

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: |
          docker pull ghcr.io/dallas-makerspace/member-profile-ui:latest

      - name: Recreate Docker container
        run: |
          docker stop member-profile-ui || true
          docker rm member-profile-ui || true
          docker run -d --name member-profile-ui -p 80:8000 ghcr.io/dallas-makerspace/member-profile-ui:latest
