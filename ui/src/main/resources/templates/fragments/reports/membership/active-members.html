<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:fragment="report">
    <dms-data-visualizer
            dataUrl="/backend-api/data-viz/active-members"
            renderAs="line"
            title="Active members by month"
            description="Number of active members at DMS for past couple of years. This data is sourced from the billing system (WHMCS) and includes both primary and addon accounts as well as regular donors."
            yAxisMin="1300"
            id="active-members-chart"
    ></dms-data-visualizer>

    <script>
        document.getElementById('active-members-chart').addEventListener('chartRendered', (event) => {
            const { lineChart, chart } = event.detail;

            if (lineChart) {
                const newRateAnnotation = {
                    type: 'line',
                    mode: 'vertical',
                    scaleID: 'x',
                    value: 'Aug',
                    borderColor: 'rgba(255, 0, 0, 0.7)',
                    borderWidth: 2,
                    borderDash: [6, 6],
                    label: {
                        display: true,
                        content: ['Aug-2025: Thursday tours start.'],
                        position: '1%',
                        backgroundColor: 'rgba(255, 0, 0, 0.7)',
                        color: 'white',
                        font: {
                            weight: 'bold'
                        }
                    },
                    click: function() {
                        window.open('https://talk.dallasmakerspace.org/t/thursday-night-tours-august/119367', '_blank');
                    }
                };

                lineChart.addAnnotation(newRateAnnotation);
            }
        });
    </script>
</div>
</body>
</html>
