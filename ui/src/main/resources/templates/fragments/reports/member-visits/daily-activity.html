<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:fragment="report">
    <dms-data-visualizer
            dataUrl="/backend-api/data-viz/visitors-by-day"
            renderAs="line"
            title="Visitors by Date"
            description="Number of members visiting DMS for the past 90 days. This data is derived from badge swipes."
            id="visitors-chart"
    ></dms-data-visualizer>

    <script>
        // Add annotation for the power outage event using the chartRendered event
        document.getElementById('visitors-chart').addEventListener('chartRendered', (event) => {
            const { lineChart, chart } = event.detail;

            if (lineChart) {
                // Create a power outage annotation
                const powerOutageAnnotation = {
                    id: 'power-outage-annotation',
                    type: 'line',
                    mode: 'vertical',   // Explicitly set vertical mode
                    scaleID: 'x',       // Anchor to x-axis
                    value: '2024-06-19', // Date value
                    borderColor: 'rgba(255, 0, 0, 0.7)',
                    borderWidth: 2,
                    borderDash: [6, 6],
                    drawTime: 'afterDatasetsDraw',
                    label: {
                        display: true,
                        content: ['Data from 6/19-20 logged on 6/21','due to power outage related issues','Click for details.'],
                        position: 'start',
                        backgroundColor: 'rgba(255, 0, 0, 0.7)',
                        color: 'white',
                        font: {
                            weight: 'bold'
                        },
                        padding: 6,
                        textAlign: 'center'
                    },
                    click: function() {
                        window.open('https://talk.dallasmakerspace.org/t/resolved-power-is-out-at-the-makerspace-thursday-11-39am/118859', '_blank');
                    }
                };

                // Add the annotation to the chart
                lineChart.addAnnotation(powerOutageAnnotation);
            }
        });
    </script>
</div>
</body>
</html>
