<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Gray background -->
    <circle cx="50" cy="50" r="50" fill="#e0e0e0"/> <!-- Gray circle background -->
    <!-- Red circle with line across -->
    <circle cx="50" cy="50" r="40" stroke="#ff0000" stroke-width="10" fill="none"/> <!-- Red circle -->
    <line x1="25" y1="75" x2="75" y2="25" stroke="#ff0000" stroke-width="10"/> <!-- Red diagonal line -->
</svg>
