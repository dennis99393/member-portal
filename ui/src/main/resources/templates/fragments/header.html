<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="top-nav" th:fragment="header">
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="/">DMS Member Portal</a>

            <!-- Mobile search icon -->
            <button class="btn navbar-search-toggle d-lg-none ms-auto me-2" type="button"
                    onclick="toggleMobileSearch()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
            </button>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Reports -->
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown"
                        th:if="${@org.dallasmakerspace.server.reports.ReportGraph@getRoot() != null}">
                        <a class="nav-link dropdown-toggle" href="javascript:void(0)" role="button"
                           data-bs-toggle="dropdown"
                           data-bs-auto-close="outside" aria-expanded="false">Reports</a>
                        <ul class="dropdown-menu">
                            <th:block
                                    th:each="reportNode : ${@org.dallasmakerspace.server.reports.ReportGraph@getRoot().getVisibleChildren()}">
                                <!-- Disabled item if no children - this is for WIP reports -->
                                <li th:if="${reportNode.children == null || reportNode.getVisibleChildren().empty}">
                                    <a class="dropdown-item disabled" th:href="'/reports/' + ${reportNode.urlSlug}"
                                       th:text="${reportNode.name}"></a>
                                </li>

                                <!-- Dropdown if has children -->
                                <li class="dropend"
                                    th:if="${reportNode.children != null && !reportNode.getVisibleChildren().empty}">
                                    <a class="dropdown-item dropdown-toggle" href="javascript:void(0)"
                                       data-bs-toggle="dropdown"
                                       data-bs-auto-close="outside" aria-expanded="false"
                                       th:text="${reportNode.name}"></a>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li th:each="childNode : ${reportNode.getVisibleChildren()}">
                                            <a class="dropdown-item"
                                               th:href="'/reports/' + ${reportNode.urlSlug} + '/' + ${childNode.urlSlug}"
                                               th:text="${childNode.name}"></a>
                                        </li>
                                    </ul>
                                </li>
                            </th:block>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item"
                                   href="https://talk.dallasmakerspace.org/new-topic?category=Infrastructure&title=%5BMemberPortal%5D%20Report%20suggestion&body=Please%20provide%20details%20about%20the%20report%20you%20would%20like%20to%20see.%0A%0A**Report%20Name:**%0A**Description:**"
                                   target="_blank">Suggest a report</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/committees">Committees</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/short-links">Short-Links</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ask-ai">Ask-AI</a>
                    </li>
                </ul>

                <!-- Desktop search (centered) -->
                <div class="navbar-search d-none d-lg-flex flex-grow-1 justify-content-center mx-3">
                    <dms-search max-results="7"></dms-search>
                </div>

                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link" href="/profile-me" role="button">
                            My Profile
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Mobile search overlay -->
    <div class="navbar-search-mobile d-none d-lg-none">
        <div class="container py-2">
            <dms-search max-results="7"></dms-search>
        </div>
    </div>

    <!-- Search component script -->
    <script type="module" src="/static/js/dms-search-v6.js"></script>
    <!-- Action tracking script -->
    <script src="/static/js/action-tracker.js" defer></script>
    <script>
        function toggleMobileSearch() {
            const overlay = document.querySelector('.navbar-search-mobile');
            overlay.classList.toggle('d-none');
            if (!overlay.classList.contains('d-none')) {
                const search = overlay.querySelector('dms-search');
                if (search && search.shadowRoot) {
                    const input = search.shadowRoot.querySelector('input');
                    if (input) input.focus();
                }
            }
        }

        // Keyboard shortcut: Ctrl/Cmd + K to focus search
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const search = document.querySelector('dms-search');
                if (search && search.shadowRoot) {
                    const input = search.shadowRoot.querySelector('input');
                    if (input) input.focus();
                }
            }
        });
    </script>

    <!-- PWA Install Prompt -->
    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/@khmyznikov/pwa-install@0.6.3/dist/pwa-install.bundle.min.js';
    </script>

    <pwa-install
        manifest-url="/manifest.json"
        icon="/static/icons/icon-192x192.png"
        name="DMS Member Portal"
        description="Install the Dallas Makerspace Member Portal for quick access"
        install-button-text="Install App"
        cancel-button-text="Not now">
    </pwa-install>

    <style>
        pwa-install {
            --install-button-color: #0b9cc9;
            --install-dialog-z-index: 9999;
        }
    </style>

    <!-- PWA Install Component Tracking -->
    <script>
        // Track pwa-install component interactions
        window.addEventListener('DOMContentLoaded', () => {
            const pwaInstall = document.querySelector('pwa-install');

            if (pwaInstall) {
                // Track when custom install dialog is shown using IntersectionObserver (more performant)
                let hasTrackedVisibility = false;
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (!hasTrackedVisibility && entry.isIntersecting && typeof track === 'function') {
                            track('pwa_install_dialog_shown', {
                                source: 'custom_component',
                                componentType: 'pwa-install',
                                platform: /Android/i.test(navigator.userAgent) ? 'android'
                                        : /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'ios'
                                        : 'desktop'
                            });
                            hasTrackedVisibility = true;
                            observer.unobserve(pwaInstall); // Stop observing after first track
                        }
                    });
                }, { threshold: 0.1 });

                observer.observe(pwaInstall);

                // Track clicks on install button (within shadow DOM)
                pwaInstall.addEventListener('click', (e) => {
                    if (typeof track === 'function') {
                        const buttonText = e.target.textContent || '';
                        const isInstallButton = buttonText.includes('Install');
                        const isCancelButton = buttonText.includes('Not now') || buttonText.includes('Cancel');

                        if (isInstallButton) {
                            track('pwa_install_button_clicked', {
                                source: 'custom_component',
                                buttonType: 'install'
                            });
                        } else if (isCancelButton) {
                            track('pwa_install_button_clicked', {
                                source: 'custom_component',
                                buttonType: 'cancel'
                            });
                        }
                    }
                });
            }
        });
    </script>
</header>
</body>
</html>
