<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="../static/styles/global.css" />
    <link rel="stylesheet" href="../static/styles/profile.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
    <title th:text="'@' + ${preferred_username}"></title>
</head>
<body>
<div class="profile">
    <header class="top-nav1">
        <div class="top-nav-separator">
            <div class="top-nav-title1">
                <div class="card-bio">
                    <img
                            class="vector-icon"
                            loading="lazy"
                            alt=""
                            src="../static/images/left-arrow.svg"
                    />
                </div>
                <div class="back-to-dms1">Back to DMS Links</div>
            </div>
        </div>
        <div class="top-nav-divider1"></div>
    </header>
    <section class="content">
        <div class="card-bio1">
            <div class="linked-accounts-label">
                <div class="profile-pic">
                    <img src="../static/images/profile-pic-not-set.svg" alt="Profile Picture">
                </div>
                <div class="bg-pic">
                    <img
                            class="mask-group-icon"
                            alt=""
                            src="../static/images/bg.webp"
                    />
                </div>
                <div class="user-fullname" th:text="${name}"></div>
            </div>
            <div class="username">
                <b class="username-label" th:text="'@' + ${preferred_username}"></b>
            </div>
            <div class="card-bio-inner" th:if="${join_date}">
                <div class="frame-parent">
                    <div class="lightbulb-circle-parent">
                        <img
                                class="lightbulb-circle-icon"
                                loading="lazy"
                                alt=""
                                src="../static/images/lightbulb-circle.svg"
                        />

                        <div class="link-account-label">
                            <b class="member-since-apr">Member since <span th:text="${join_date}"></span></b>
                        </div>
                    </div>
                    <div class="vector-parent">
                        <img class="vector-icon1" alt="" src="../static/images/clock.svg" />

                        <div class="total-time-at-dms-21-years-wrapper">
                            <b class="total-time-at">Total time at DMS: <span th:text="${membership_duration}"></span></b>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-linked-accounts">
            <div class="linked-accounts">Linked Accounts</div>
            <div class="discourse-icon-1-parent">
                <img
                        class="discourse-icon-1"
                        loading="lazy"
                        alt=""
                        src="../static/images/discourse.svg"
                />

                <div class="frame-wrapper">
                    <div class="talk-member-parent">
                        <b class="talk-member">Talk:
                            <span th:if="${talk_username}"><a th:href="|https://talk.dallasmakerspace.org/u/${talk_username}/summary|" target="_blank"><span th:text="|@${talk_username}|"></span></a></span>
                            <span th:unless="${talk_username}">Not Linked</span>
                        </b>
                        <div class="unlink-account" id="unlinkAccountText">
                            <span th:if="${talk_username}"><a th:href="${talk_username}">Unlink Account</a></span>
                            <span th:unless="${talk_username}"><a href="/link-discourse">Link Account</a></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="frame-group">
                <img
                        class="frame-child"
                        loading="lazy"
                        alt=""
                        src="../static/images/discord.svg"
                />

                <div class="frame-container">
                    <div class="discord-not-linked-parent">
                        <b class="discord-not-linked-container">
                            <span>Discord:</span>
                            <span class="span"> </span>
                            <span>Coming Soon</span>
                        </b>
                    </div>
                </div>
            </div>
            <div class="vector-group">
                <img class="vector-icon2" alt="" src="../static/images/github.svg" />

                <div class="github-coming-soon-wrapper">
                    <b class="github-coming-soon">Github: Coming Soon</b>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
