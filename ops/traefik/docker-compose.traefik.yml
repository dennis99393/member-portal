services:
  traefik:
    container_name: member-profile-taefik
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "127.0.0.1:8082:8082"   # dashboard — localhost only, not exposed externally
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      - member-portal
      - guacamole_guacamole_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  member-portal:
    external: true
  guacamole_guacamole_net:
    external: true
