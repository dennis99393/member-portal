name: Common CD Workflow

# This common workflow deploys member portal components to production
# Features: Gradle caching, Trivy security scanning, basic health checks, semantic versioning

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (service or ui)'
        required: true
        type: string
      port:
        description: 'External port to expose'
        required: true
        type: string
      internal_port:
        description: 'Internal container port'
        required: true
        type: string
      env_file_path:
        description: 'Path to environment file on self-hosted runner'
        required: true
        type: string
      image_name:
        description: 'Docker image name'
        required: true
        type: string
      package_name:
        description: 'Container package name for cleanup'
        required: true
        type: string
      container_name:
        description: 'Docker container name'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Enable Gradle caching for faster builds
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Build and Create Fat JAR
        run: ./gradlew :${{ inputs.component }}:shadowJar -x detekt

      - name: Run Tests
        run: ./gradlew :${{ inputs.component }}:test -x detekt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.component }}
          path: ${{ inputs.component }}/build/test-results/
          retention-days: 30

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate semantic version tags (latest, SHA, run number)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value=v${{ github.run_number }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.component }}
          push: true
          file: ${{ inputs.component }}/prod.Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Scan container for vulnerabilities
      - name: Pull image for scanning
        continue-on-error: true
        run: docker pull ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Cleanup old package versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ inputs.package_name }}
          package-type: 'container'
          min-versions-to-keep: 5

  deploy:
    needs: build-and-push-image
    name: Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 10

    environment:
      name: production
      url: http://member.dallasmakerspace.org

    steps:
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Pull latest Docker image
        shell: bash
        run: |
          docker pull ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest

      # Deploy container (simple stop/recreate approach)
      - name: Deploy container
        id: deploy
        shell: bash
        run: |
          echo "Stopping old container..."
          docker stop ${{ inputs.container_name }} || true
          docker rm ${{ inputs.container_name }} || true

          echo "Starting new container..."
          docker run -d --restart unless-stopped --network member-portal \
            --env-file ${{ inputs.env_file_path }} \
            --name ${{ inputs.container_name }} \
            -p ${{ inputs.port }}:${{ inputs.internal_port }} \
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest

          echo "Deployment complete!"

      - name: Wait for container to start
        shell: bash
        run: |
          echo "Waiting for container to be ready..."
          sleep 10

      - name: Basic health check
        shell: bash
        continue-on-error: true
        run: |
          echo "Checking if container is running..."
          docker ps --filter "name=${{ inputs.container_name }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "Container logs (last 20 lines):"
          docker logs ${{ inputs.container_name }} --tail 20

      - name: Verify deployment
        shell: bash
        run: |
          echo "Verifying deployment status..."
          if docker ps --filter "name=${{ inputs.container_name }}" --format "{{.Names}}" | grep -q "${{ inputs.container_name }}"; then
            echo "✓ Container is running"
            docker ps --filter "name=${{ inputs.container_name }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          else
            echo "✗ Container is not running!"
            exit 1
          fi
